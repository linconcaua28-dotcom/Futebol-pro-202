
name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Extrair projeto
        run: |
          mkdir extracted
          unzip -q *.zip -d extracted

      - name: Instalar dependências
        working-directory: extracted/futbol_build
        run: npm install

      - name: Adicionar Android
        working-directory: extracted/futbol_build
        run: npx cap add android

      - name: Sincronizar
        working-directory: extracted/futbol_build
        run: npx cap sync android

      - name: Compilar APK
        working-directory: extracted/futbol_build/android
        run: ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: FUTBOL-PRO-2027
          path: extracted/futbol_build/android/app/build/outputs/apk/debug/app-debug.apk
          
